<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Gimmick Filter">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@700&amp;display=swap');
      .gf-gimmick { font-family: Inter, 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.42em; fill: #8fa9ae; }
      .gf-filter  { font-family: Anton, 'Anton', Impact, 'Arial Narrow', sans-serif; font-size: 104px; letter-spacing: 0.02em; fill: #ffffff; }
    </style>

    <!-- Forme du masque (centrée sur 0,0) -->
    <path id="gf-face" d="M-80 -95 Q0 -120 80 -95 C86 -25 62 66 0 94 C-62 66 -86 -25 -80 -95 Z"/>
    <clipPath id="gf-face-clip"><use xlink:href="#gf-face"/></clipPath>

    <!-- Couleurs du ring Match Impact -->
    <linearGradient id="gf-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f1f3"/>
      <stop offset="0.5" stop-color="#d6e6e9"/>
      <stop offset="1" stop-color="#b8cfd3"/>
    </linearGradient>
    <linearGradient id="gf-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa9ae"/>
      <stop offset="1" stop-color="#3a7684"/>
    </linearGradient>
    <radialGradient id="gf-shine" cx="0.32" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond + cadre (identiques à Match Impact) -->
  <rect width="512" height="512" fill="#0b1f24"/>
  <rect x="20" y="20" width="472" height="472" rx="26" fill="#0f262c" stroke="#1f3d44" stroke-width="4"/>

  <!-- ===== Masque tragédie (derrière, à droite) ===== -->
  <g transform="translate(306 186) rotate(13) scale(0.86)">
    <use xlink:href="#gf-face" transform="translate(8 10)" fill="#0b1f24" opacity="0.7"/>
    <use xlink:href="#gf-face" fill="url(#gf-dark)"/>
    <g clip-path="url(#gf-face-clip)">
      <path d="M0 -130 L100 -130 L100 110 L0 110 Z" fill="#163840" opacity="0.35"/>
    </g>
    <!-- Arcades / sourcils relevés au centre -->
    <g fill="none" stroke-linecap="round">
      <path d="M-60 -48 Q-36 -52 -10 -72" stroke="#163840" stroke-width="7"/>
      <path d="M10 -72 Q36 -52 60 -48" stroke="#163840" stroke-width="7"/>
      <path d="M-58 -52 Q-36 -56 -12 -76" stroke="#b8cfd3" stroke-width="2.5" opacity="0.8"/>
    </g>
    <!-- Yeux tombants -->
    <g fill="#0b1f24">
      <path d="M-54 -30 Q-30 -18 -10 -36 Q-32 -42 -54 -30 Z"/>
      <path d="M54 -30 Q30 -18 10 -36 Q32 -42 54 -30 Z"/>
    </g>
    <!-- Nez -->
    <path d="M0 -30 L-8 10 Q0 18 8 10" fill="none" stroke="#163840" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bouche triste -->
    <path d="M-38 58 Q0 8 38 58 Q0 38 -38 58 Z" fill="#0b1f24" stroke="#163840" stroke-width="3" stroke-linejoin="round"/>
    <use xlink:href="#gf-face" fill="none" stroke="#0b1f24" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- ===== Masque comédie (devant, à gauche) ===== -->
  <g transform="translate(206 192) rotate(-13) scale(0.9)">
    <use xlink:href="#gf-face" transform="translate(10 10)" fill="#0b1f24" opacity="0.75"/>
    <use xlink:href="#gf-face" fill="url(#gf-light)"/>
    <g clip-path="url(#gf-face-clip)">
      <path d="M0 -130 L100 -130 L100 110 L0 110 Z" fill="#8fa9ae" opacity="0.35"/>
      <ellipse cx="-34" cy="-54" rx="70" ry="80" fill="url(#gf-shine)"/>
    </g>
    <!-- Sourcils arqués -->
    <g fill="none" stroke-linecap="round">
      <path d="M-60 -50 Q-34 -76 -8 -56" stroke="#2b5f6b" stroke-width="7"/>
      <path d="M8 -56 Q34 -76 60 -50" stroke="#2b5f6b" stroke-width="7"/>
      <path d="M-58 -55 Q-34 -80 -10 -61" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    </g>
    <!-- Yeux rieurs -->
    <g fill="#0b1f24">
      <path d="M-56 -26 Q-32 -48 -10 -28 Q-32 -34 -56 -26 Z"/>
      <path d="M56 -26 Q32 -48 10 -28 Q32 -34 56 -26 Z"/>
    </g>
    <!-- Nez -->
    <path d="M0 -32 L-8 6 Q0 14 8 6" fill="none" stroke="#2b5f6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pommettes -->
    <g fill="none" stroke="#2b5f6b" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M-50 4 Q-54 22 -44 32"/>
      <path d="M50 4 Q54 22 44 32"/>
    </g>
    <!-- Grand sourire -->
    <path d="M-46 22 Q0 82 46 22 Q0 44 -46 22 Z" fill="#0b1f24" stroke="#2b5f6b" stroke-width="3" stroke-linejoin="round"/>
    <use xlink:href="#gf-face" fill="none" stroke="#0b1f24" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- Badge filtre (en haut à droite des masques) -->
  <circle cx="384" cy="84" r="40" fill="#0f262c" stroke="#0b1f24" stroke-width="6"/>
  <circle cx="384" cy="84" r="37" fill="#163840" stroke="#2b5f6b" stroke-width="3"/>
  <path d="M356 63 L412 63 L392 88 L392 108 L376 116 L376 88 Z" fill="#4ade80" stroke="#0b1f24" stroke-width="3" stroke-linejoin="round"/>

  <!-- Texte -->
  <text class="gf-gimmick" x="261.5" y="345" text-anchor="middle">GIMMICK</text>
  <text class="gf-filter" x="256" y="442" text-anchor="middle">FILTER</text>
</svg>
